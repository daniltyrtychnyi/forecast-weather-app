<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Forecast Weather App</title>
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">
    <script src="./script.js" defer></script>
</head>
<body>
    <main class="weather">
        <h1 class="visually-hidden">Forecast Weather App</h1>
        <form class="weather__search-city-form">
            <label for="search-city" class="weather__label visually-hidden">Enter your location</label>
            <input id="search-city" type="text" class="weather__input" placeholder="Enter your location" autocomplete="off">
            <button class="weather__button" type="submit" title="Search city" aria-label="Search city">
                <svg fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30px" height="30px">
                    <path d="M 13 3 C 7.4889971 3 3 7.4889971 3 13 C 3 18.511003 7.4889971 23 13 23 C 15.396508 23 17.597385 22.148986 19.322266 20.736328 L 25.292969 26.707031 A 1.0001 1.0001 0 1 0 26.707031 25.292969 L 20.736328 19.322266 C 22.148986 17.597385 23 15.396508 23 13 C 23 7.4889971 18.511003 3 13 3 z M 13 5 C 17.430123 5 21 8.5698774 21 13 C 21 17.430123 17.430123 21 13 21 C 8.5698774 21 5 17.430123 5 13 C 5 8.5698774 8.5698774 5 13 5 z"/>
                </svg>
            </button>
        </form>
        <div class="weather__location">
            <span class="weather__location-name">Belaya Kalitva</span>
            <time class="weather__location-time">Sun, 02 Aug</time>
        </div>
        <div class="weather__current">
            <img src="./assets/icons/partly-cloudy.svg" alt="" class="weather__image" width="100" height="100">
            <div class="weather__info">
                <span class="weather__temperature">29 °C</span>
                <p class="weather__condition">Cloudy</p>
            </div>
        </div>
    </main>
</body>
</html>
